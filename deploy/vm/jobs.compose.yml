# Role jobs (deploy.sh sets IMAGE, TAG and VERSION; the rest comes from /etc/tq/tq.env).
services:
  jobs:
    image: ${IMAGE}/jobs:${TAG}
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 35s # in-flight requests finish (the server allows 30 s); its twin takes new ones
    volumes: ["/etc/tq/certs:/certs:ro"]
    environment:
      TLS_DIR: /certs
      VERSION: ${VERSION}
      DATABASE_URL: ${JOBS_DB_URL}
      JWKS_URL: ${JWKS_URL} # every auth, nearest first
