# Local stack. First time, and whenever certificates expire:
#   go run ./cmd/devcerts
#   docker compose -f deploy/local/compose.yml up --build
# Everything talks TLS: the gateway (https://localhost:8443) is the only public port, and
# every internal call uses mTLS with certificates from deploy/local/certs.
# MUTANT=mutant_<name> builds a deliberately broken variant for the chaos checker's self-test.
name: taskqueue

x-service: &service
  restart: unless-stopped
  volumes: ["./certs:/certs:ro"]
  environment: &env
    TLS_DIR: /certs
x-jobs-db: &jobs-db postgres://jobs_svc:jobs-local-only@pg1:5432,pg2:5432/jobs?target_session_attrs=read-write&sslmode=verify-full&sslrootcert=/certs/ca.crt
x-sinks-db: &sinks-db postgres://postgres:sinks-local-only@sinks-postgres:5432/sinks?sslmode=disable
x-auth-db: &auth-db postgres://auth_svc:auth-local-only@pg1:5432,pg2:5432/auth?target_session_attrs=read-write&sslmode=verify-full&sslrootcert=/certs/ca.crt

services:
  # PostgreSQL: two nodes managed by Patroni, which elects the primary through a 3-member
  # etcd cluster and fails over automatically. Clients list both nodes and connect to
  # whichever accepts writes (target_session_attrs=read-write).
  etcd1:
    image: quay.io/coreos/etcd:v3.6.6
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=taskqueue
    volumes: ["etcd1data:/etcd-data"]

  etcd2:
    image: quay.io/coreos/etcd:v3.6.6
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=taskqueue
    volumes: ["etcd2data:/etcd-data"]

  etcd3:
    image: quay.io/coreos/etcd:v3.6.6
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=taskqueue
    volumes: ["etcd3data:/etcd-data"]

  pg1:
    build: ./patroni
    restart: unless-stopped
    cap_add: [NET_ADMIN] # for tc netem
    environment:
      PATRONI_NAME: pg1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
      NETEM_DELAY: 2750us
    ports: ["5432:5432"] # tests and the chaos checker connect from the host
    volumes:
      - pg1data:/var/lib/postgresql/data
      - ./certs:/certs:ro
    depends_on: [etcd1, etcd2, etcd3]
    healthcheck: # healthy once Patroni runs PostgreSQL, as primary or replica
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 60

  pg2:
    build: ./patroni
    restart: unless-stopped
    cap_add: [NET_ADMIN] # for tc netem
    environment:
      PATRONI_NAME: pg2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
      NETEM_DELAY: 2750us
    ports: ["5434:5432"] # tests and the chaos checker connect from the host
    volumes:
      - pg2data:/var/lib/postgresql/data
      - ./certs:/certs:ro
    depends_on: [etcd1, etcd2, etcd3]
    healthcheck: # healthy once Patroni runs PostgreSQL, as primary or replica
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 60

  migrate-jobs:
    <<: *service
    restart: "no"
    build: { context: ../.., target: app, args: { CMD: migrate, TAGS: "${MUTANT:-}" } }
    command: ["jobs"]
    environment: { <<: *env, DATABASE_URL: *jobs-db }
    depends_on: { pg1: { condition: service_healthy }, pg2: { condition: service_healthy } }

  migrate-auth:
    <<: *service
    restart: "no"
    build: { context: ../.., target: app, args: { CMD: migrate, TAGS: "${MUTANT:-}" } }
    command: ["auth"]
    environment: { <<: *env, DATABASE_URL: *auth-db }
    depends_on: { pg1: { condition: service_healthy }, pg2: { condition: service_healthy } }

  auth:
    <<: *service
    build: { context: ../.., target: app, args: { CMD: auth, TAGS: "${MUTANT:-}" } }
    env_file: ./certs/secrets.env # JWT_PRIVATE_KEY, written by cmd/devcerts
    environment:
      <<: *env
      DATABASE_URL: *auth-db
      # Local demo accounts only.
      SEED_USERS: admin@example.com:admin-password-1:admin,demo@example.com:demo-password-1
    depends_on: { migrate-auth: { condition: service_completed_successfully } }

  jobs:
    <<: *service
    build: { context: ../.., target: app, args: { CMD: jobs, TAGS: "${MUTANT:-}" } }
    environment: { <<: *env, DATABASE_URL: *jobs-db, JWKS_URL: "https://auth:8083/.well-known/jwks.json" }
    depends_on: { migrate-jobs: { condition: service_completed_successfully } }

  dispatch:
    <<: *service
    build: { context: ../.., target: app, args: { CMD: dispatch, TAGS: "${MUTANT:-}" } }
    environment: { <<: *env, DATABASE_URL: *jobs-db }
    depends_on: { migrate-jobs: { condition: service_completed_successfully } }

  scheduler:
    <<: *service
    build: { context: ../.., target: app, args: { CMD: scheduler, TAGS: "${MUTANT:-}" } }
    scale: 2 # one leads; the other takes over when it dies
    environment: { <<: *env, DATABASE_URL: *jobs-db }
    depends_on: { migrate-jobs: { condition: service_completed_successfully } }

  worker:
    <<: *service
    build: { context: ../.., target: app, args: { CMD: worker, TAGS: "${MUTANT:-}" } }
    scale: 2
    environment:
      <<: *env
      DISPATCHERS: https://dispatch:8081
      CLOUD: aws
      CONCURRENCY: 8
      SINKS_URL: https://sinks:8090
      SMTP_ADDR: mailpit:1025
      WEBHOOK_ALLOW: https://sinks:8090/webhook
    stop_grace_period: 1m # drain: running jobs finish before the container stops
    depends_on: [dispatch, sinks]

  gateway:
    <<: *service
    build: { context: ../.., target: gateway, args: { CMD: gateway, TAGS: "${MUTANT:-}" } }
    environment:
      <<: *env
      AUTH_URL: https://auth:8083
      JOBS_URL: https://jobs:8080
      PUBLIC_ORIGIN: https://localhost:8443
    ports: ["8443:8443"]
    depends_on: [auth, jobs]

  # Test destinations: they play external systems, so they have their own database and
  # are never faulted by the chaos harness.
  sinks-postgres:
    image: postgres:18
    restart: unless-stopped
    environment: { POSTGRES_PASSWORD: sinks-local-only, POSTGRES_DB: sinks }
    ports: ["5433:5432"]
    volumes: ["sinksdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate-sinks:
    <<: *service
    restart: "no"
    build: { context: ../.., target: app, args: { CMD: migrate, TAGS: "${MUTANT:-}" } }
    command: ["sinks"]
    environment: { <<: *env, DATABASE_URL: *sinks-db }
    depends_on: { sinks-postgres: { condition: service_healthy } }

  sinks:
    <<: *service
    build: { context: ../.., target: app, args: { CMD: sinks, TAGS: "${MUTANT:-}" } }
    environment: { <<: *env, DATABASE_URL: *sinks-db }
    depends_on: { migrate-sinks: { condition: service_completed_successfully } }

  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    environment: { MP_MAX_MESSAGES: 0 } # keep every message: the checker counts them all
    ports: ["8025:8025"]

  # Monitoring: Prometheus scrapes dispatch and the schedulers over mTLS; Grafana (local
  # only, anonymous read access) at http://localhost:3000.
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./certs:/certs:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/task-queue.json
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  pg1data:
  pg2data:
  etcd1data:
  etcd2data:
  etcd3data:
  sinksdata:
